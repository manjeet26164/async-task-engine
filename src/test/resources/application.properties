# Test Configuration
spring.application.name=distributed-task-engine-test

# API Key for test slices
app.security.api-key=test-secret-key-2026
app.security.admin-api-key=test-admin-key-2026

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.ssl.enabled=false

# Worker Recovery & Lease Management
app.worker.stuck-timeout-seconds=300
app.worker.recovery-interval-ms=60000
